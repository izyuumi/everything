[package]
name = "everything"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "Apache-2.0"
description = "Local-first native AI agent host"
default-run = "everything"

[workspace]
members = ["relay"]
default-members = [".", "relay"]
resolver = "3"

[dependencies]
clap = { version = "4.5", features = ["derive", "env"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
uuid = { version = "1", features = ["serde", "v4"] }
async-trait = "0.1"
futures-core = "0.3"
tokio-util = { version = "0.7", features = ["rt"] }
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros", "time", "sync", "net", "io-util", "process", "signal", "io-std"] }
jsonschema = { version = "0.58", default-features = false }
rusqlite = { version = "0.37", features = ["bundled"] }
pulldown-cmark = "0.13"
sha2 = "0.10"
cap-std = "3"
base64 = "0.22"
chacha20poly1305 = "0.10"
ed25519-dalek = "2.2"
x25519-dalek = { version = "2", features = ["static_secrets"] }
hkdf = "0.12"
hmac = "0.12"
rand_core = { version = "0.6", features = ["getrandom"] }
zeroize = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
eventsource-stream = "0.2"
async-stream = "0.3"
futures-util = "0.3"
bytes = "1"
rustix = { version = "1", features = ["fs", "process"] }
fs2 = "0.4"
plist = "1.8"
tracing = "0.1"
url = "2"

[features]
default = []
local-embeddings = ["dep:ort", "dep:tokenizers"]

[dependencies.ort]
version = "=2.0.0-rc.10"
default-features = false
features = ["std", "load-dynamic"]
optional = true

[[bin]]
name = "everything-embedding-bench"
path = "src/bin/everything-embedding-bench.rs"
required-features = ["local-embeddings"]

[dependencies.tokenizers]
version = "=0.22.2"
default-features = false
features = ["fancy-regex"]
optional = true
