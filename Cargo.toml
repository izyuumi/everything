[package]
name = "everything"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "Apache-2.0"
description = "Local-first native AI agent host"
default-run = "everything"

[workspace]
resolver = "3"

[dependencies]
clap = { version = "4.5", features = ["derive", "env"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
uuid = { version = "1", features = ["serde", "v4"] }
async-trait = "0.1"
futures-core = "0.3"
tokio-util = { version = "0.7", features = ["rt", "codec"] }
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros", "time", "sync", "net", "io-util", "process", "signal", "io-std"] }
jsonschema = { version = "0.58", default-features = false }
rusqlite = { version = "0.37", features = ["bundled"] }
pulldown-cmark = "0.13"
sha2 = "0.10"
cap-std = "3"
base64 = "0.22"
chacha20poly1305 = "0.10"
ed25519-dalek = "2.2"
x25519-dalek = { version = "2", features = ["static_secrets"] }
hkdf = "0.12"
hmac = "0.12"
rand_core = { version = "0.6", features = ["getrandom"] }
zeroize = "1"
ring = "0.17"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
eventsource-stream = "0.2"
async-stream = "0.3"
futures-util = { version = "0.3", features = ["sink"] }
bytes = "1"
rustix = { version = "1", features = ["fs", "process"] }
fs2 = "0.4"
plist = "1.8"
tracing = "0.1"
url = "2"
toml = "0.9"
rmcp = { version = "=3.5.1", default-features = false, features = ["client", "transport-async-rw"] }
qrcode = { version = "0.14", default-features = false, features = ["svg"] }
tokio-tungstenite = { version = "0.29", features = ["rustls-tls-webpki-roots"] }
chrono = "0.4.42"
chrono-tz = "0.10.4"
croner = "=4.0.1"
ratatui = "0.29"
crossterm = { version = "0.28", features = ["event-stream"] }
unicode-width = "0.2"
axum = { version = "0.8", default-features = false, features = ["http1", "tokio", "ws"] }
tokio-rusqlite = { version = "0.7", features = ["bundled"] }
hyper = { version = "1", features = ["http1", "server"] }
hyper-util = { version = "0.1", features = ["tokio", "service"] }
self_update = { version = "1.3.3", default-features = false, features = ["reqwest", "rustls", "archive-tar", "compression-tar-gz"] }

[features]
default = []
local-embeddings = ["dep:ort", "dep:tokenizers", "dep:sqlite-vec", "dep:command-fds"]

[dependencies.ort]
version = "=2.0.0-rc.10"
default-features = false
features = ["std", "load-dynamic"]
optional = true

[[bin]]
name = "everything-embedding-bench"
path = "src/bin/everything-embedding-bench.rs"
required-features = ["local-embeddings"]

[[bin]]
name = "everything-embedding-worker"
path = "src/bin/everything-embedding-worker.rs"
required-features = ["local-embeddings"]

[dependencies.tokenizers]
version = "=0.22.2"
default-features = false
features = ["fancy-regex"]
optional = true

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "=3.6.3", default-features = false, features = ["apple-native"] }

[target.'cfg(target_os = "linux")'.dependencies]
command-fds = { version = "=0.3.3", optional = true }
keyring = { version = "=3.6.3", default-features = false, features = ["sync-secret-service", "crypto-rust", "vendored"] }

[dependencies.sqlite-vec]
version = "=0.1.9"
optional = true
