name: Extended validation
on:
  workflow_dispatch:
    inputs:
      retain_runtime_artifact:
        description: Retain the default Linux CLI for separate manual verification
        required: false
        default: false
        type: boolean
      inspect_cli_startup:
        description: Run public help and version on the default Linux CLI
        required: false
        default: false
        type: boolean
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  rust:
    name: Extended Rust (${{ matrix.os }})
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - run: cargo build --workspace --release --locked
      - name: Retain default Linux CLI
        if: ${{ matrix.os == 'ubuntu-latest' && inputs.retain_runtime_artifact }}
        uses: actions/upload-artifact@v4
        with:
          name: vorra-linux-default-${{ github.sha }}
          path: target/release/vorra
          retention-days: 3
          if-no-files-found: error
          compression-level: 6
      - name: Inspect default Linux CLI startup
        if: ${{ github.event_name == 'workflow_dispatch' && matrix.os == 'ubuntu-latest' && inputs.inspect_cli_startup }}
        timeout-minutes: 2
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          cli_startup_root="$(mktemp -d "${RUNNER_TEMP}/vorra-cli-startup.XXXXXX")"
          mkdir -p "${cli_startup_root}/home" "${cli_startup_root}/tmp"
          HOME="${cli_startup_root}/home" TMPDIR="${cli_startup_root}/tmp" target/release/vorra --help
          HOME="${cli_startup_root}/home" TMPDIR="${cli_startup_root}/tmp" target/release/vorra --version
      - run: cargo build --workspace --release --all-features --locked
  msrv:
    name: Rust 1.88 MSRV
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@1.88.0
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --workspace --all-targets --all-features --locked
