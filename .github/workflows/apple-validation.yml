name: Apple validation
on:
  push:
    paths:
      - 'apps/Apple/**'
      - '.github/workflows/apple-validation.yml'
  pull_request:
    paths:
      - 'apps/Apple/**'
      - '.github/workflows/apple-validation.yml'
permissions:
  contents: read
jobs:
  xcode:
    name: ${{ matrix.scheme }} build and analyze
    runs-on: macos-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - scheme: EverythingMac
            destination: 'generic/platform=macOS'
          - scheme: EverythingIOS
            destination: 'generic/platform=iOS Simulator'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Build and analyze
        env:
          APPLE_SCHEME: ${{ matrix.scheme }}
          APPLE_DESTINATION: ${{ matrix.destination }}
        run: |
          xcodebuild \
            -project apps/Apple/Everything.xcodeproj \
            -scheme "$APPLE_SCHEME" \
            -configuration Debug \
            -destination "$APPLE_DESTINATION" \
            -derivedDataPath "$RUNNER_TEMP/everything-apple-$APPLE_SCHEME" \
            CODE_SIGNING_ALLOWED=NO \
            build analyze
